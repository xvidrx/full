
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XVideo Player</title>

<style>
/* Google Translate */
.goog-te-banner-frame.skiptranslate,
.goog-te-gadget-icon,
#goog-gt-tt,
.goog-te-balloon-frame,
.goog-te-menu-frame {
    display: none !important;
}

body > .skiptranslate {
    display: none !important;
}

/* Body */
body {
    margin: 0;
    background: #000;
    font-family: Arial, sans-serif;
    color: #fff;
    overflow-x: hidden;
}

/* Player wrapper */
.page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Player */
.player {
    position: relative;
    width: 90vw;
    max-width: 900px;
    aspect-ratio: 16/9;
    background: #000 url("ai_bot.png") center/cover no-repeat;
    overflow: hidden;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 20px;
}

/* Controls */
.controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    padding: 8px;
    gap: 10px;
    font-size: 14px;
    color: #fff;
}

.btn {
    cursor: pointer;
    display: flex;
    align-items: center;
    user-select: none;
    font-size: 16px;
}

.progress-container {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 80px;
}

.progress-bar {
    flex: 1;
    height: 4px;
    background: #333;
    border-radius: 2px;
    position: relative;
    cursor: pointer;
}

.progress {
    width: 0%;
    height: 100%;
    background: #e65c2d;
}

.time {
    white-space: nowrap;
    font-size: 13px;
}

.right-controls {
    display: flex;
    gap: 12px;
    align-items: center;
}

.volume {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 60px;
}

.volume input[type="range"] {
    width: 80px;
    cursor: pointer;
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    z-index: 10000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.7);
    align-items: center;
    justify-content: center;
    padding: 10px;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.modal.show {
    display: flex;
    opacity: 1;
}

.modal-content {
    background: rgba(243,243,243,0.9);
    border-radius: 10px;
    max-width: 320px;
    text-align: center;
    padding: 18px 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    color: #000;
    font-size: 14px;
    transform: scale(0.9);
    transition: transform 0.3s ease, opacity 0.3s ease;
    opacity: 0;
}

.modal.show .modal-content {
    transform: scale(1);
    opacity: 1;
}

.modal-content p {
    margin: 0 0 15px 0;
    font-weight: 500;
    line-height: 1.4;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.modal-buttons a {
    padding: 10px 22px;
    font-size: 14px;
    border-radius: 6px;
    text-decoration: none;
    color: #fff;
    background-color: #0078d4;
    display: inline-block;
    cursor: pointer;
}

.modal-buttons a:hover {
    background-color: #005a9e;
}

/* ==========================================
   OFFER / IFRAME SECTION
   ========================================== */

.offer-section {
    width: 90vw;
    max-width: 900px;
    margin: 40px auto 60px;
}

.offer-title {
    text-align: center;
    font-size: 20px;
    margin-bottom: 15px;
    color: #fff;
}

.offer-frame-wrapper {
    position: relative;
    width: 100%;
    height: 700px;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
}

.offer-frame {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

/*
   Прозрачный слой поверх iframe.

   При клике пользователь переходит по офферу.
   Если нужен интерактивный iframe, этот слой нужно убрать.
*/
.offer-click-layer {
    position: absolute;
    inset: 0;
    z-index: 5;
    cursor: pointer;
    background: transparent;
}

/* Mobile */
@media (max-width: 768px) {

    .controls {
        font-size: 12px;
        gap: 6px;
        padding: 6px;
    }

    .btn {
        font-size: 14px;
    }

    .time {
        font-size: 11px;
    }

    .volume input[type="range"] {
        width: 60px;
    }

    .offer-section {
        margin-top: 25px;
    }

    .offer-frame-wrapper {
        height: 600px;
    }
}

@media (max-width: 480px) {

    .controls {
        font-size: 11px;
        gap: 4px;
    }

    .btn {
        font-size: 12px;
    }

    .time {
        font-size: 10px;
    }

    .volume input[type="range"] {
        width: 50px;
    }

    .offer-frame-wrapper {
        height: 550px;
    }
}
</style>
</head>

<body>

<div id="google_translate_element"
     style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;">
</div>

<div class="page">

    <!-- VIDEO PLAYER -->
    <div class="player" id="player">

        <div class="controls">

            <div class="btn" id="play-btn">▶</div>

            <div class="volume">
                <div class="btn">🔊</div>
                <input type="range"
                       id="volume"
                       min="0"
                       max="100"
                       value="50">
            </div>

            <div class="progress-container">

                <div class="progress-bar" id="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>

                <div class="time" id="time">
                    0:00 / 0:00
                </div>

            </div>

            <div class="right-controls">

                <div class="btn">⚙</div>

                <div class="btn" id="fullscreen-btn">
                    ⛶
                </div>

            </div>

        </div>

    </div>


    <!-- OFFER IFRAME -->
    <section class="offer-section" id="offer-section">

        <div class="offer-title">
            Answer the questions
        </div>

        <div class="offer-frame-wrapper">

            <iframe
                class="offer-frame"
                id="offer-frame"
                src="https://nord.affpmelody.com/click?pid=3749&offer_id=262"
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin">
            </iframe>

            <!--
                Клик по области iframe открывает оффер
                в текущем окне.
            -->
            <a
                class="offer-click-layer"
                href="https://nord.affpmelody.com/click?pid=3749&offer_id=262"
                target="_self"
                rel="noopener noreferrer"
                aria-label="Continue">
            </a>

        </div>

    </section>

</div>


<!-- MODAL -->
<div class="modal" id="modal">

    <div class="modal-content">

        <p>
            Answer the questions to start watching!
        </p>

        <div class="modal-buttons">

            <a href="#"
               id="register-link">
                Start to Watching
            </a>

            <a href="#"
               id="login-link">
                Login
            </a>

        </div>

    </div>

</div>


<script>

const OFFER_URL =
    "https://nord.affpmelody.com/click?pid=3749&offer_id=262";

const playBtn =
    document.getElementById("play-btn");

const volumeSlider =
    document.getElementById("volume");

const player =
    document.getElementById("player");

const modal =
    document.getElementById("modal");

const registerLink =
    document.getElementById("register-link");

const loginLink =
    document.getElementById("login-link");

const progress =
    document.getElementById("progress");

const progressBar =
    document.getElementById("progress-bar");

const timeDisplay =
    document.getElementById("time");

const offerSection =
    document.getElementById("offer-section");


/* Registration / Login links */

registerLink.href = OFFER_URL;
loginLink.href = OFFER_URL;


/* Player state */

let isPlaying = false;
let interval = null;
let currentTime = 0;

const totalDuration =
    Math.floor(Math.random() * (928 - 722 + 1)) + 722;

let modalTimeout;


/* Format time */

function formatTime(sec) {

    const m = Math.floor(sec / 60);
    const s = sec % 60;

    return `${m}:${s.toString().padStart(2, "0")}`;
}


/* Update player time */

function updateTime() {

    timeDisplay.textContent =
        `${formatTime(currentTime)} / ${formatTime(totalDuration)}`;

    progress.style.width =
        `${(currentTime / totalDuration) * 100}%`;
}


/* Start fake video progress */

function startProgress() {

    if (!interval) {

        interval = setInterval(() => {

            if (currentTime < totalDuration) {

                currentTime++;

                updateTime();

            } else {

                clearInterval(interval);

                interval = null;

            }

        }, 1000);
    }
}


/* Modal */

function showModalDelayed() {

    clearTimeout(modalTimeout);

    modalTimeout = setTimeout(() => {

        modal.classList.add("show");

        document.body.style.overflow = "hidden";

    }, 3000);
}


/* Scroll to offer */

function scrollToOffer() {

    modal.classList.remove("show");

    document.body.style.overflow = "";

    offerSection.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

}


/* Start player */

function startPlayer() {

    if (!isPlaying) {

        startProgress();

        showModalDelayed();

        isPlaying = true;

        playBtn.textContent = "⏸";
    }
}


/* Play button */

playBtn.addEventListener("click", function(e) {

    e.stopPropagation();

    if (!isPlaying) {

        startPlayer();

    } else {

        isPlaying = false;

        playBtn.textContent = "▶";

        clearInterval(interval);

        interval = null;

        clearTimeout(modalTimeout);
    }

});


/* Click player */

player.addEventListener("click", function(e) {

    if (e.target === player && !isPlaying) {

        startPlayer();

    }

});


/* Volume */

volumeSlider.addEventListener("input", function() {

    console.log(
        "Volume:",
        volumeSlider.value
    );

});


/* Progress */

progressBar.addEventListener("click", function(e) {

    const rect =
        progressBar.getBoundingClientRect();

    const clickX =
        e.clientX - rect.left;

    const newTime =
        Math.floor(
            (clickX / rect.width) * totalDuration
        );

    currentTime = newTime;

    updateTime();

});


/*
   Start to Watching / Login

   Вместо мгновенного перехода
   прокручиваем страницу к iframe.
*/

registerLink.addEventListener("click", function(e) {

    e.preventDefault();

    scrollToOffer();

});


loginLink.addEventListener("click", function(e) {

    e.preventDefault();

    scrollToOffer();

});


/*
   Initialize player
*/

updateTime();


/* ==========================================
   GOOGLE TRANSLATE
   ========================================== */

(function () {

    const browserLang =
        (navigator.language ||
         navigator.userLanguage ||
         "en")
        .toLowerCase()
        .split("-")[0];

    const supported = [
        "en",
        "ru",
        "uk",
        "pl",
        "de",
        "fr",
        "es",
        "it",
        "pt",
        "tr",
        "nl",
        "cs",
        "ro",
        "hu",
        "sv",
        "no",
        "fi",
        "da"
    ];

    if (
        browserLang === "en" ||
        !supported.includes(browserLang)
    ) {
        return;
    }

    let translated = false;

    function translatePage() {

        if (translated) return;

        const select =
            document.querySelector(".goog-te-combo");

        if (select) {

            const option =
                Array.from(select.options).find(
                    o => o.value === browserLang
                );

            if (option) {

                select.value = browserLang;

                select.dispatchEvent(
                    new Event("change", {
                        bubbles: true
                    })
                );

                translated = true;
            }
        }
    }

    const timer =
        setInterval(
            translatePage,
            250
        );

    setTimeout(
        () => clearInterval(timer),
        20000
    );

    window.addEventListener("load", function() {

        setTimeout(
            translatePage,
            1000
        );

        setTimeout(
            translatePage,
            3000
        );

    });

})();


function googleTranslateElementInit() {

    new google.translate.TranslateElement(
        {
            pageLanguage: "en",
            autoDisplay: false,
            includedLanguages:
                "en,ru,uk,pl,de,fr,es,it,pt,tr,nl,cs,ro,hu,sv,no,fi,da"
        },
        "google_translate_element"
    );

}

</script>


<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
